<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Jameel Noori Nastaleeq';
    src: url('file:///C:/Users/DELL/.gemini/antigravity/worktrees/delightful-goodall/gujranwala_facebook_page_automation/assets/fonts/JameelNooriNastaleeq-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 1080px;
    height: 1350px;
    background: #091224;
    font-family: 'Jameel Noori Nastaleeq', serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Top Background Scene */
  .hero-container {
    position: relative;
    width: 1080px;
    height: 590px;
    overflow: hidden;
  }
  .hero-bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: brightness(0.95) contrast(1.1);
  }
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(9,18,36,0.2) 0%, rgba(9,18,36,0.65) 70%, #091224 100%);
  }

  /* Top Bar */
  .top-bar {
    position: absolute;
    top: 26px;
    left: 40px;
    right: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .channel-emblem {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: radial-gradient(circle, #b91c1c 0%, #7f1d1d 100%);
    border: 3.5px solid #ffffff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
  }
  .channel-emblem .title {
    font-size: 18px;
    font-weight: bold;
    line-height: 1;
  }
  .channel-emblem .tag {
    font-size: 24px;
    font-weight: 900;
    color: #fde047;
    line-height: 1;
    font-family: sans-serif;
  }

  .alert-ribbon {
    background: linear-gradient(135deg, #b91c1c 0%, #dc2626 50%, #991b1b 100%);
    border: 2.5px solid #fde047;
    border-radius: 8px;
    padding: 6px 36px;
    box-shadow: 0 8px 24px rgba(220,38,38,0.6);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .alert-slash {
    color: #fde047;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -2px;
    font-family: sans-serif;
  }
  .alert-text {
    font-size: 44px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
    margin-top: -6px;
  }

  /* Content Section */
  .content-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px 48px 0;
    position: relative;
    z-index: 5;
  }

  /* Slanted Headline Banners */
  .headline-banner-red {
    width: 990px;
    height: 110px;
    background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
    border: 3.5px solid #ffffff;
    border-radius: 14px;
    transform: skewX(-10deg);
    box-shadow: 0 14px 30px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .headline-banner-red .banner-text {
    transform: skewX(10deg);
    font-size: 64px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
    -webkit-text-stroke: 1px #ffffff;
    text-shadow: 0 3px 6px rgba(0,0,0,0.9);
    margin-top: -6px;
  }

  .headline-banner-green {
    width: 950px;
    height: 108px;
    background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
    border: 3.5px solid #ffffff;
    border-radius: 14px;
    transform: skewX(-10deg);
    box-shadow: 0 14px 30px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 34px;
  }
  .headline-banner-green .banner-text {
    transform: skewX(10deg);
    font-size: 62px;
    font-weight: bold;
    color: #fde047;
    line-height: 1;
    -webkit-text-stroke: 1px #fde047;
    text-shadow: 0 3px 6px rgba(0,0,0,0.9);
    margin-top: -6px;
  }

  /* Metadata Cards */
  .meta-row {
    display: flex;
    width: 990px;
    justify-content: space-between;
    gap: 28px;
    margin-bottom: 25px;
  }
  .meta-card {
    flex: 1;
    height: 160px;
    background: #ffffff;
    border-radius: 20px;
    border: 3px solid #e2e8f0;
    box-shadow: 0 12px 28px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    padding: 0 28px;
    gap: 22px;
    direction: rtl;
  }
  .meta-icon-bubble-green {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: linear-gradient(135deg, #15803d 0%, #166534 100%);
    border: 3px solid #bbf7d0;
    box-shadow: 0 6px 14px rgba(21,128,61,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .meta-icon-bubble-blue {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    border: 3px solid #bae6fd;
    box-shadow: 0 6px 14px rgba(2,132,199,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .meta-text-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    text-align: right;
    flex: 1;
  }
  .meta-label-badge {
    background: #15803d;
    color: #ffffff;
    font-family: sans-serif;
    font-size: 20px;
    font-weight: bold;
    padding: 4px 14px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .meta-label-badge-blue {
    background: #0369a1;
    color: #ffffff;
    font-family: sans-serif;
    font-size: 20px;
    font-weight: bold;
    padding: 4px 14px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .meta-value {
    font-size: 42px;
    font-weight: bold;
    color: #0f172a;
    line-height: 1.1;
    margin-top: 2px;
    -webkit-text-stroke: 0.5px #0f172a;
  }

  /* Footer Strip */
  .footer-strip {
    width: 1080px;
    height: 130px;
    background: linear-gradient(90deg, #7f1d1d 0%, #b91c1c 50%, #7f1d1d 100%);
    border-top: 4px solid #fde047;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 45px;
    direction: ltr;
  }
  .social-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .social-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .follow-text {
    color: #ffffff;
    font-family: 'Jameel Noori Nastaleeq', serif;
    font-size: 34px;
    font-weight: bold;
    margin-left: 8px;
    line-height: 1;
  }
  .brand-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    direction: rtl;
  }
  .brand-title {
    font-size: 52px;
    font-weight: bold;
    color: #fde047;
    line-height: 1;
    -webkit-text-stroke: 0.5px #fde047;
  }
  .brand-tagline {
    font-size: 26px;
    color: #ffffff;
    line-height: 1.2;
    margin-top: 2px;
  }
</style>
</head>
