  /* Color System */
  :root {
    --deep-navy: #102B3A;
    --burgundy: #700D22;
    --warm-white: #F7F7F2;
    --yellow-accent: #FFE044;
    --dark-text: #17212B;
    --muted-grey: #E3E8EB;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1080px;
    background: var(--warm-white);
    color: var(--dark-text);
    font-family: 'NotoSansArabic', sans-serif;
    position: relative;
    overflow: hidden;
    padding: 60px; /* Outer safe margin: 60px */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }


  /* Header Bar (height: 50px) */
  .header-bar {
    width: 960px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: ltr;
  }
  .brand-logo-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-monogram {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--burgundy);
    color: var(--warm-white);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-name-en {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--deep-navy);
  }
  .category-pill {
    background: var(--burgundy);
    color: var(--warm-white);
    font-family: 'NotoSansArabic', sans-serif;
    font-size: 34px;
    font-weight: 700;
    padding: 4px 22px;
    border-radius: 8px;
    line-height: 1.2;
    direction: rtl;
  }

  /* Headline Panel (height: 320px) */
  .headline-panel {
    width: 960px;
    height: 320px;
    background: var(--burgundy);
    border-radius: 16px;
    padding: 40px 40px 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    box-shadow: 0 4px 16px rgba(112, 13, 34, 0.22);
  }
  .hl-line {
    font-family: 'JameelNooriNastaleeq', serif;
    font-size: 74px; /* Standard authentic Jameel Noori Nastaleeq size */
    color: var(--warm-white);
    line-height: 1.55;
    white-space: nowrap;
    text-align: center;
  }

  /* Photo Panel (height: 330px) */
  .photo-panel {
    width: 960px;
    height: 330px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: var(--deep-navy);
    box-shadow: 0 4px 14px rgba(16, 43, 58, 0.15);
  }
  .photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }

  /* Supporting Text Panel (height: 125px) */
  .supporting-panel {
    width: 960px;
    height: 125px;
    background: var(--deep-navy);
    border-radius: 14px;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .supporting-text {
    font-family: 'NotoSansArabic', sans-serif;
    font-size: 40px; /* Essential text >= 40px */
    font-weight: 500;
    color: var(--warm-white);
    line-height: 1.35;
  }

  /* Branded Footer (height: 40px) */
  .footer-bar {
    width: 960px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: ltr;
    padding: 0 4px;
  }
  .source-meta {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    color: #556270;
    font-weight: 600;
    white-space: nowrap;
  }
  .footer-urdu-brand {
    font-family: 'JameelNooriNastaleeq', serif;
    font-size: 38px;
    color: var(--burgundy);
    direction: rtl;
    white-space: nowrap;
    line-height: 1;
  }
</style>
