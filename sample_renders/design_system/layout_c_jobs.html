    font-weight: 800;

  /* Color System */
  :root {
    --deep-navy: #102B3A;
    --burgundy: #700D22;
    --warm-white: #F7F7F2;
    --yellow-accent: #FFE044;
    --dark-text: #17212B;
    --muted-grey: #E3E8EB;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1080px;
    height: 1080px;
    background: var(--warm-white);
    color: var(--dark-text);
    font-family: 'NotoSansArabic', sans-serif;
    position: relative;
    overflow: hidden;
    padding: 60px; /* Outer safe margin: 60px */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }


  /* Header Bar */
  .header-bar {
    width: 960px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: ltr;
  }
  .brand-logo-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-monogram {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--deep-navy);
    color: var(--warm-white);
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-name-en {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--deep-navy);
  }
  .category-pill {
    background: var(--deep-navy);
    color: var(--warm-white);
    font-family: 'NotoSansArabic', sans-serif;
    font-size: 34px;
    font-weight: 700;
    padding: 4px 22px;
    border-radius: 8px;
    direction: rtl;
  }

  /* Headline Panel (height: 260px) */
  .headline-panel {
    width: 960px;
    height: 260px;
    background: var(--deep-navy);
    border-radius: 16px;
    padding: 35px 40px 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .hl-line {
    font-family: 'JameelNooriNastaleeq', serif;
    font-size: 66px; /* Jameel Noori Nastaleeq calibrated size */
    color: var(--warm-white);
    line-height: 1.5;
    white-space: nowrap;
    text-align: center;
  }

  /* Relevant Photograph Panel (height: 330px) */
  .photo-panel {
    width: 960px;
    height: 330px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: var(--deep-navy);
  }
  .photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
  }

  /* Three Separated Information Blocks (height: 240px) */
  .blocks-row {
    width: 960px;
    height: 240px;
    display: flex;
    justify-content: space-between;
    gap: 24px; /* Gap between panels >= 24px */
  }
  .info-block {
    flex: 1;
    background: var(--muted-grey);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-top: 6px solid var(--burgundy);
    direction: rtl;
    text-align: right;
  }
  .block-label {
    font-family: 'NotoSansArabic', sans-serif;
    font-size: 34px; /* Short labels: 34–38 px */
    font-weight: 700;
    color: var(--burgundy);
    line-height: 1.2;
  }
  .block-value {
    font-family: 'NotoSansArabic', sans-serif;
    font-size: 40px; /* Supporting text / value >= 40px */
    font-weight: 700;
    color: var(--dark-text);
    line-height: 1.25;
  }

  /* Branded Footer (height: 40px) */
  .footer-bar {
    width: 960px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    direction: ltr;
    padding: 0 4px;
  }
  .source-meta {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    color: #556270;
    font-weight: 600;
    white-space: nowrap;
  }
  .footer-urdu-brand {
    font-family: 'JameelNooriNastaleeq', serif;
    font-size: 36px;
    color: var(--deep-navy);
    direction: rtl;
    white-space: nowrap;
    line-height: 1;
  }
</style>
