<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Jameel Noori Nastaleeq';
    src: url('file:///C:/Users/DELL/.gemini/antigravity/worktrees/delightful-goodall/gujranwala_facebook_page_automation/assets/fonts/JameelNooriNastaleeq-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 1080px;
    height: 1185px;
    background: #061530;
    font-family: 'Jameel Noori Nastaleeq', serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Top Section: Deep Royal Midnight Backdrop */
  .top-section {
    width: 1080px;
    height: 380px;
    background: radial-gradient(circle at 50% 20%, #0d285c 0%, #061530 65%, #030a17 100%);
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 18px;
  }

  /* Channel Circle Badge Top-Left */
  .channel-emblem {
    position: absolute;
    top: 18px;
    left: 28px;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: radial-gradient(circle, #b91c1c 0%, #881337 75%, #4c0519 100%);
    border: 3.5px solid #ffffff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    text-align: center;
  }
  .channel-emblem .title {
    font-size: 17px;
    font-weight: bold;
    line-height: 1;
    margin-top: 2px;
  }
  .channel-emblem .num {
    font-size: 26px;
    font-weight: 900;
    color: #fde047;
    line-height: 1;
    font-family: sans-serif;
  }

  /* Top Breaking Ribbon */
  .breaking-ribbon {
    background: linear-gradient(135deg, #b91c1c 0%, #dc2626 50%, #991b1b 100%);
    border: 2.5px solid #fde047;
    border-radius: 8px;
    padding: 4px 38px;
    box-shadow: 0 8px 24px rgba(220,38,38,0.6);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .breaking-slash {
    color: #fde047;
    font-family: sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -2px;
  }
  .breaking-text {
    font-size: 42px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
    margin-top: -6px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }

  /* Three-Tier Headline */
  .headline-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: 10px;
  }
  .hl-line1 {
    font-size: 72px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.1;
    -webkit-text-stroke: 1px #ffffff;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
  }
  .hl-line2 {
    font-size: 68px;
    font-weight: bold;
    color: #fde047;
    line-height: 1.1;
    margin-top: -8px;
    -webkit-text-stroke: 1px #fde047;
    text-shadow: 0 4px 12px rgba(0,0,0,0.9);
  }
  .hl-badge {
    background: linear-gradient(135deg, #b91c1c 0%, #e11d48 50%, #991b1b 100%);
    border: 2px solid #ffffff;
    border-radius: 40px;
    padding: 3px 55px;
    box-shadow: 0 8px 25px rgba(225,29,72,0.7);
    margin-top: 8px;
  }
  .hl-badge-text {
    font-size: 54px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.15;
    -webkit-text-stroke: 0.8px #ffffff;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    display: block;
    margin-top: -4px;
  }

  /* Full-Bleed Composite Photo Scene (Hospital + Dr. Kashif Seamless) */
  .scene-container {
    position: absolute;
    top: 380px;
    left: 0;
    right: 0;
    height: 640px;
    overflow: hidden;
    z-index: 1;
  }
  .scene-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }
  /* Soft dark gradient at top of scene to merge with headline backdrop */
  .scene-fade-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(180deg, #061530 0%, transparent 100%);
  }

  /* 3D Slanted VIP Nameplate Banner Across Bottom of Photo */
  .nameplate-wrapper {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 10;
  }
  .nameplate-banner {
    width: 980px;
    background: linear-gradient(135deg, #991b1b 0%, #b91c1c 50%, #7f1d1d 100%);
    border: 3.5px solid #ffffff;
    border-radius: 20px;
    transform: skewX(-8deg);
    box-shadow: 0 16px 36px rgba(0,0,0,0.85), inset 0 2px 0 rgba(255,255,255,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0 14px;
  }
  .np-name {
    transform: skewX(8deg);
    font-size: 60px;
    font-weight: bold;
    color: #fde047;
    line-height: 1.05;
    -webkit-text-stroke: 1px #fde047;
    text-shadow: 0 3px 6px rgba(0,0,0,0.8);
    margin-top: -6px;
  }
  .np-title {
    transform: skewX(8deg);
    font-size: 40px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.05;
    margin-top: -2px;
    -webkit-text-stroke: 0.5px #ffffff;
  }

  /* Gold Accent Bottom Trim */
  .gold-trim {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 14px;
    background: linear-gradient(90deg, #d97706 0%, #fde047 50%, #d97706 100%);
    z-index: 20;
  }
</style>
