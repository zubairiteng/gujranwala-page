<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Jameel Noori Nastaleeq';
    src: url('file:///C:/Users/DELL/.gemini/antigravity/worktrees/delightful-goodall/gujranwala_facebook_page_automation/assets/fonts/JameelNooriNastaleeq-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 1080px;
    height: 1220px;
    background: radial-gradient(circle at 50% 15%, #0f2e66 0%, #061633 55%, #020917 100%);
    font-family: 'Jameel Noori Nastaleeq', serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Top Header Bar */
  .top-bar {
    width: 1080px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    position: relative;
    z-index: 10;
    direction: ltr;
  }
  .channel-emblem-sm {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: radial-gradient(circle, #b91c1c 0%, #881337 75%, #4c0519 100%);
    border: 3px solid #ffffff;
    box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    text-align: center;
  }
  .channel-emblem-sm .title {
    font-size: 15px;
    font-weight: bold;
    line-height: 1;
  }
  .channel-emblem-sm .num {
    font-size: 22px;
    font-weight: 900;
    color: #fde047;
    line-height: 1;
    font-family: sans-serif;
  }

  /* Centered Breaking Ribbon */
  .breaking-ribbon {
    background: linear-gradient(135deg, #b91c1c 0%, #dc2626 50%, #991b1b 100%);
    border: 2.5px solid #fde047;
    border-radius: 8px;
    padding: 6px 36px;
    box-shadow: 0 8px 20px rgba(220,38,38,0.5), inset 0 1px 0 rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    gap: 12px;
    direction: rtl;
  }
  .breaking-slash {
    color: #fde047;
    font-family: sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -2px;
  }
  .breaking-text {
    font-size: 44px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
    margin-top: -6px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }

  /* Headline Section (Top 35%) */
  .headline-section {
    width: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 8px 40px 0;
    z-index: 10;
  }
  .hl-line1 {
    font-size: 70px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.15;
    -webkit-text-stroke: 1px #ffffff;
    text-shadow: 0 4px 10px rgba(0,0,0,0.8), 0 0 25px rgba(255,255,255,0.2);
  }
  .hl-line2 {
    font-size: 66px;
    font-weight: bold;
    color: #fde047;
    line-height: 1.15;
    margin-top: -6px;
    -webkit-text-stroke: 1px #fde047;
    text-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 0 20px rgba(253,224,71,0.3);
  }
  .hl-badge-container {
    margin-top: 10px;
    display: inline-block;
  }
  .hl-badge {
    background: linear-gradient(135deg, #b91c1c 0%, #e11d48 50%, #991b1b 100%);
    border: 2px solid #ffffff;
    border-radius: 40px;
    padding: 4px 50px;
    box-shadow: 0 8px 24px rgba(225,29,72,0.6);
    display: inline-block;
  }
  .hl-badge-text {
    font-size: 54px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.15;
    -webkit-text-stroke: 0.8px #ffffff;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
    display: block;
    margin-top: -4px;
  }

  /* Mid Visual Composite - LTR so Portrait is Left, Building is Right */
  .visual-composite {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    position: relative;
    z-index: 5;
    margin-top: 10px;
    direction: ltr;
  }
  .portrait-card {
    width: 370px;
    height: 380px;
    border-radius: 20px;
    overflow: hidden;
    border: 3.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    background: #0f2e66;
    position: relative;
  }
  .portrait-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  .hospital-building-card {
    width: 600px;
    height: 380px;
    border-radius: 20px;
    overflow: hidden;
    border: 3.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    position: relative;
  }
  .building-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .building-tag {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    padding: 12px 18px;
    color: #fde047;
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    direction: rtl;
  }

  /* VIP Nameplate Section */
  .nameplate-section {
    width: 1080px;
    display: flex;
    justify-content: center;
    position: relative;
    z-index: 10;
    margin-bottom: 25px;
  }
  .nameplate-pill {
    width: 960px;
    background: linear-gradient(135deg, #991b1b 0%, #b91c1c 50%, #7f1d1d 100%);
    border: 3.5px solid #ffffff;
    border-radius: 20px;
    transform: skewX(-8deg);
    box-shadow: 0 14px 32px rgba(0,0,0,0.7), inset 0 2px 0 rgba(255,255,255,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0 14px;
  }
  .np-name {
    transform: skewX(8deg);
    font-size: 56px;
    font-weight: bold;
    color: #fde047;
    line-height: 1.1;
    -webkit-text-stroke: 1px #fde047;
    text-shadow: 0 3px 6px rgba(0,0,0,0.8);
    margin-top: -6px;
  }
  .np-title {
    transform: skewX(8deg);
    font-size: 38px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1.1;
    margin-top: -2px;
    -webkit-text-stroke: 0.5px #ffffff;
    opacity: 0.95;
  }

  /* Golden Trim Footer */
  .gold-trim {
    width: 1080px;
    height: 14px;
    background: linear-gradient(90deg, #d97706 0%, #fde047 50%, #d97706 100%);
  }
</style>
</head>
