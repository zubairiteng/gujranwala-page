name: Hamara Gujranwala Facebook Autonomous Manager

on:
  schedule:
    # 7 Independent Peak Daily Slots across Pakistan Standard Time (PKT):
    - cron: '30 3 * * *'   # 08:30 AM PKT (Morning News & Weather)
    - cron: '30 6 * * *'   # 11:30 AM PKT (Midday Breaking News)
    - cron: '30 9 * * *'   # 02:30 PM PKT (Afternoon Spot News)
    - cron: '30 12 * * *'  # 05:30 PM PKT (Hero Tribute & Wrestling Pride)
    - cron: '30 14 * * *'  # 07:30 PM PKT (Evening Prime News)
    - cron: '30 16 * * *'  # 09:30 PM PKT (Food & Cultural Heritage)
    - cron: '30 17 * * *'  # 10:30 PM PKT (Community Discussion)

  workflow_dispatch:
    inputs:
      action:
        description: 'Posting Action to Execute'
        required: true
        default: 'approved'
        type: choice
        options:
          - 'approved'
          - 'auto'
          - 'news'
          - 'hero'
          - 'culture'
          - 'stats'

permissions:
  contents: write

jobs:
  run-facebook-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Fonts (for Image Cards)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-core fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Engine
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || '61578710350501' }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            python daily_engine.py --action ${{ inputs.action }}
          else
            python daily_engine.py --action auto
          fi

      - name: Commit & Push Updated History and Logs
        run: |
          git config --global user.name "Hamara Gujranwala Bot"
          git config --global user.email "bot@hamara-gujranwala.local"
          git add history.json daily_logs/
          git diff --staged --quiet || git commit -m "chore: record published post & update daily growth log [skip ci]"
          git push
