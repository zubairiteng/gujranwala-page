<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Jameel Noori Nastaleeq';
    src: url('file:///C:/Users/DELL/.gemini/antigravity/worktrees/delightful-goodall/gujranwala_facebook_page_automation/assets/fonts/JameelNooriNastaleeq-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    width: 1080px;
    height: 1350px;
    background: #0f172a;
    font-family: 'Jameel Noori Nastaleeq', serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Top Visual Scene (Real Building, Pylons & Sunset) */
  .hero-container {
    position: relative;
    width: 1080px;
    height: 650px;
    overflow: hidden;
  }
  .hero-bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    filter: brightness(1.05) contrast(1.08);
  }
  .hero-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(15,23,42,0) 0%, rgba(15,23,42,0.2) 65%, #0f172a 100%);
  }

  /* Content Mid Section */
  .content-section {
    flex: 1;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 10px 48px 0;
    position: relative;
    z-index: 5;
  }

  /* 3D Slanted Banners */
  .slanted-banner-red {
    width: 990px;
    height: 110px;
    background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
    border: 3.5px solid #ffffff;
    border-radius: 14px;
    transform: skewX(-10deg);
    box-shadow: 0 14px 30px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .slanted-banner-red .banner-text {
    transform: skewX(10deg);
    font-size: 66px;
    font-weight: bold;
    color: #ffffff;
    line-height: 1;
    -webkit-text-stroke: 1px #ffffff;
    text-shadow: 0 4px 8px rgba(0,0,0,0.9);
    margin-top: -6px;
  }

  .slanted-banner-green {
    width: 950px;
    height: 108px;
    background: linear-gradient(180deg, #15803d 0%, #14532d 100%);
    border: 3.5px solid #ffffff;
    border-radius: 14px;
    transform: skewX(-10deg);
    box-shadow: 0 14px 30px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 34px;
  }
  .slanted-banner-green .banner-text {
    transform: skewX(10deg);
    font-size: 64px;
    font-weight: bold;
    line-height: 1;
    text-shadow: 0 4px 8px rgba(0,0,0,0.9);
    margin-top: -6px;
  }
  .highlight-yellow {
    color: #fde047;
    -webkit-text-stroke: 1px #fde047;
    margin-left: 10px;
  }
  .text-white {
    color: #ffffff;
    -webkit-text-stroke: 1px #ffffff;
  }

  /* Metadata Cards Row */
  .meta-row {
    display: flex;
    width: 990px;
    justify-content: space-between;
    gap: 28px;
    margin-bottom: 25px;
  }
  .meta-card {
    flex: 1;
    height: 160px;
    background: #ffffff;
    border-radius: 20px;
    border: 3px solid #e2e8f0;
    box-shadow: 0 12px 28px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    padding: 0 28px;
    gap: 22px;
    direction: rtl;
  }
  .meta-icon-bubble {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
    border: 3px solid #fecaca;
    box-shadow: 0 6px 14px rgba(185,28,28,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .meta-text-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    text-align: right;
    flex: 1;
  }
  .meta-label-badge {
    background: #991b1b;
    color: #ffffff;
    font-family: sans-serif;
    font-size: 20px;
    font-weight: bold;
    padding: 4px 14px;
    border-radius: 6px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .meta-value {
    font-size: 44px;
    font-weight: bold;
    color: #0f172a;
    line-height: 1.1;
    margin-top: 2px;
    -webkit-text-stroke: 0.5px #0f172a;
  }

  /* Bottom Brand Strip */
  .footer-strip {
    width: 1080px;
    height: 130px;
    background: linear-gradient(90deg, #7f1d1d 0%, #b91c1c 50%, #7f1d1d 100%);
    border-top: 4px solid #fde047;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 45px;
    direction: ltr;
  }
  .social-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .social-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .follow-text {
    color: #ffffff;
    font-family: 'Jameel Noori Nastaleeq', serif;
    font-size: 34px;
    font-weight: bold;
    margin-left: 8px;
    line-height: 1;
  }
  .brand-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    direction: rtl;
  }
  .brand-title {
    font-size: 52px;
    font-weight: bold;
    color: #fde047;
    line-height: 1;
    -webkit-text-stroke: 0.5px #fde047;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .brand-tagline {
    font-size: 26px;
    color: #ffffff;
    line-height: 1.2;
    margin-top: 2px;
    opacity: 0.95;
  }
</style>
</head>
